<!doctype html><meta charset=utf-8><title>Lights Out</title><style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(#1d2140,#0b0c16);color:#e8e9ff;font:15px system-ui,sans-serif}
#g{display:grid;grid-template-columns:repeat(5,min(16vw,64px));gap:8px;margin:14px 0}
#g b{aspect-ratio:1;border-radius:12px;background:#22264a;cursor:pointer;transition:.18s;box-shadow:inset 0 0 0 1px #33396a}
#g b.on{background:#ffd36b;box-shadow:0 0 22px #ffb53a,inset 0 0 0 1px #fff3}
#g b:hover{transform:scale(1.05)}
.r{display:flex;gap:14px;justify-content:center}button{background:#33396a;color:#fff;border:0;border-radius:8px;padding:6px 12px;cursor:pointer}
p{margin:4px;text-align:center;opacity:.8}
</style><div><p><b>LIGHTS OUT</b> · switch every light off. Each press flips a light and its neighbours.</p>
<div class=r><span id=l></span><span id=m></span><span id=p></span></div><div id=g></div>
<div class=r><button id=re>Restart level</button><button id=u>Undo</button></div><p id=w></p></div><script>
let L=1,s,start,moves,hist,G=document.getElementById('g'),$=i=>document.getElementById(i);
for(let i=0;i<25;i++){let e=document.createElement('b');e.onclick=()=>press(i,1);G.append(e)}
function flip(i){let r=i/5|0,c=i%5;[[0,0],[1,0],[-1,0],[0,1],[0,-1]].map(([a,b])=>{let R=r+a,C=c+b;if(R>=0&&R<5&&C>=0&&C<5)s[R*5+C]^=1})}
function level(){s=Array(25).fill(0);let k=new Set;while(k.size<Math.min(L+2,13))k.add(Math.random()*25|0);k.forEach(flip);start=[...s];moves=0;hist=[];$('w').textContent='';draw();$('p').textContent='par '+k.size}
function press(i,user){if(s.every(v=>!v))return;hist.push(i);flip(i);moves++;draw();if(s.every(v=>!v)){$('w').textContent=moves<=+$('p').textContent.slice(4)?'Perfect! Next level...':'Solved! Next level...';setTimeout(()=>{L++;level()},1300)}}
function draw(){[...G.children].map((e,i)=>e.className=s[i]?'on':'');$('l').textContent='level '+L;$('m').textContent='moves '+moves}
$('re').onclick=()=>{s=[...start];moves=0;hist=[];$('w').textContent='';draw()};
$('u').onclick=()=>{if(hist.length){flip(hist.pop());moves--;draw()}};level();
</script>
