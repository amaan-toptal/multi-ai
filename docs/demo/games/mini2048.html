<!doctype html><meta charset=utf-8><title>2048 mini</title><style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#faf8ef;color:#776e65;font:700 16px sans-serif}
#g{display:grid;grid-template-columns:repeat(4,min(20vw,80px));gap:8px;background:#bbada0;padding:8px;border-radius:8px;margin:10px 0}
#g b{aspect-ratio:1;border-radius:6px;display:grid;place-items:center;font-size:24px}p{text-align:center;margin:4px}
</style><div><p>2048 mini · arrows or swipe to merge tiles</p><p id=s></p><div id=g></div></div><script>
let B=Array(16).fill(0),sc=0,G=document.getElementById('g'),S=document.getElementById('s'),sx,sy;
for(let i=0;i<16;i++)G.append(document.createElement('b'));
function add(){let e=B.map((v,i)=>v?-1:i).filter(i=>i>=0);if(e.length)B[e[Math.random()*e.length|0]]=Math.random()<.9?2:4}
function line(l){let a=l.filter(v=>v),o=[];for(let i=0;i<a.length;i++){if(a[i]==a[i+1]){o.push(a[i]*2);sc+=a[i]*2;i++}else o.push(a[i])}while(o.length<4)o.push(0);return o}
function move(d){let old=B+'';for(let k=0;k<4;k++){let idx=[0,1,2,3].map(j=>d<2?(d?k*4+3-j:k*4+j):(d==2?j*4+k:(3-j)*4+k)),v=line(idx.map(i=>B[i]));idx.map((i,j)=>B[i]=v[j])}if(B+''!=old)add();draw()}
function draw(){[...G.children].map((e,i)=>{let v=B[i];e.textContent=v||'';e.style.background=v?`hsl(${40-Math.log2(v)*4},${50+Math.log2(v)*4}%,${88-Math.log2(v)*4}%)`:'#cdc1b4';e.style.color=v>4?'#fff':'#776e65'});
let over=!B.includes(0)&&B.every((v,i)=>v!=B[i+1]||i%4==3)&&B.every((v,i)=>v!=B[i+4]);S.textContent=`score ${sc}${over?' · no moves left, reload to retry':''}${B.includes(2048)?' · 2048!':''}`}
onkeydown=e=>{let d={ArrowLeft:0,ArrowRight:1,ArrowUp:2,ArrowDown:3}[e.key];if(d!=null){e.preventDefault();move(d)}};
ontouchstart=e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY};ontouchend=e=>{let X=e.changedTouches[0].clientX-sx,Y=e.changedTouches[0].clientY-sy;if(Math.max(Math.abs(X),Math.abs(Y))>20)move(Math.abs(X)>Math.abs(Y)?(X>0?1:0):(Y>0?3:2))};
add();add();draw();
</script>
