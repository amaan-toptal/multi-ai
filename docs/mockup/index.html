<title>multi-ai workspace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* Workspace shell (v6): a macOS-style menu bar over an infinite canvas. Each project is a window on the canvas holding
   one copy of the project app (template below) in an iframe, so projects run side by side without sharing state. */
:root{
  --font-ui:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,Roboto,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --bar-bg:rgba(248,250,251,.9); --bar-fg:#1b2126; --bar-muted:#59636c; --bar-line:rgba(20,30,40,.12);
  --canvas:#d9e1e4; --dots:rgba(30,50,60,.16);
  --chrome:#e8eaed; --chrome-2:#dcdfe3; --chrome-fg:#262b31; --chrome-muted:#69727b; --chrome-line:#c5cad0;
  --panel:#ffffff; --panel-2:#f3f5f7; --fg:#1b2126; --muted:#5b656e; --line:#d7dce1;
  --accent:#1f6fd1; --accent-fg:#ffffff; --run:#8a5f00; --run-soft:#fff0bf; --run-ring:#e8ad00; --ok:#137a39; --ok-soft:#d6f2df; --ok-ring:#2aa75c;
  --orch:#6d55c4; --orch-soft:#ece8fb; --dbg:#c026d3;
  --shadow:0 18px 40px rgba(15,25,35,.22),0 1px 3px rgba(15,25,35,.16); --scrim:rgba(12,18,24,.45);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bar-bg:rgba(28,31,35,.9); --bar-fg:#eef1f3; --bar-muted:#a3acb4; --bar-line:rgba(255,255,255,.10);
    --canvas:#1b2328; --dots:rgba(200,220,230,.12);
    --chrome:#2b2e33; --chrome-2:#232629; --chrome-fg:#e7eaed; --chrome-muted:#9aa3ab; --chrome-line:#41464d;
    --panel:#1f2226; --panel-2:#272a2f; --fg:#e9ecef; --muted:#a2abb3; --line:#3a3f45;
    --accent:#5ea2ff; --accent-fg:#0b1420; --run:#f2c14b; --run-soft:#3d310b; --ok:#56d68b; --ok-soft:#113321; --ok-ring:#2fb164;
    --orch:#a593e8; --orch-soft:#2a2440; --dbg:#e879f9;
    --shadow:0 18px 40px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.4); --scrim:rgba(0,0,0,.6); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bar-bg:rgba(28,31,35,.9); --bar-fg:#eef1f3; --bar-muted:#a3acb4; --bar-line:rgba(255,255,255,.10);
  --canvas:#1b2328; --dots:rgba(200,220,230,.12);
  --chrome:#2b2e33; --chrome-2:#232629; --chrome-fg:#e7eaed; --chrome-muted:#9aa3ab; --chrome-line:#41464d;
  --panel:#1f2226; --panel-2:#272a2f; --fg:#e9ecef; --muted:#a2abb3; --line:#3a3f45;
  --accent:#5ea2ff; --accent-fg:#0b1420; --run:#f2c14b; --run-soft:#3d310b; --ok:#56d68b; --ok-soft:#113321; --ok-ring:#2fb164;
  --orch:#a593e8; --orch-soft:#2a2440; --dbg:#e879f9;
  --shadow:0 18px 40px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.4); --scrim:rgba(0,0,0,.6); color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--canvas);color:var(--fg);font-family:var(--font-ui);font-size:13px;overflow:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ws{position:relative;height:100%;display:flex;flex-direction:column;overflow:hidden;overflow:clip}
.wbar{position:relative;z-index:50;display:flex;align-items:center;gap:4px;min-height:30px;padding:2px 12px;background:var(--bar-bg);color:var(--bar-fg);border-bottom:1px solid var(--bar-line);backdrop-filter:blur(14px);font-size:13px;white-space:nowrap}
.wbar .logo{font-weight:700;padding:0 8px 0 2px}
.menus{display:flex;align-items:center;gap:1px;min-width:0;overflow:hidden}
.mtop{border:0;background:transparent;padding:3px 9px;border-radius:5px;cursor:default;font-size:13px}
.mtop:hover,.mtop[aria-expanded="true"]{background:var(--bar-line)}
.wbar .spacer{flex:1}
.wbar .stat{font-size:12px;color:var(--bar-muted);padding:0 6px;font-variant-numeric:tabular-nums}
.wbar .stat b{color:var(--bar-fg);font-weight:600}
.needs{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--orch);color:var(--orch);background:transparent;border-radius:999px;padding:1px 10px;font-size:12px;font-weight:600;cursor:pointer}
.needs::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.needs.none{border-color:var(--bar-line);color:var(--bar-muted);font-weight:500;cursor:default}
.ws.plain .menus{display:none}
.ws.single.plain .wbar{display:none}
.mpop{position:absolute;z-index:200;min-width:250px;max-width:min(420px,calc(100vw - 16px));padding:5px;background:var(--panel);border:1px solid var(--line);border-radius:9px;box-shadow:var(--shadow);font-size:13px}
.mpop button{display:flex;align-items:center;gap:10px;width:100%;padding:5px 9px;border:0;border-radius:5px;background:transparent;text-align:left;cursor:default}
.mpop button:hover:not(:disabled),.mpop button:focus-visible{background:var(--accent);color:var(--accent-fg);outline:none}
.mpop button:disabled{opacity:.45}
.mpop .ck{width:14px;flex:none;text-align:center}
.mpop .lb{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.mpop kbd{font:11px var(--font-mono);opacity:.7}
.mpop .sub{font-size:11px;opacity:.75}
.mpop hr{border:0;border-top:1px solid var(--line);margin:4px 6px}
.mpop .sec{padding:4px 9px 2px;font-size:11px;color:var(--muted)}

.canvas{position:relative;flex:1;min-height:0;overflow:hidden;overflow:clip;background-color:var(--canvas);background-image:radial-gradient(var(--dots) 1px,transparent 1.4px);touch-action:none;cursor:grab}
.canvas.panning{cursor:grabbing}
.world{position:absolute;left:0;top:0;width:0;height:0;transform-origin:0 0}
.pw{position:absolute;display:flex;flex-direction:column;border-radius:12px;overflow:hidden;background:var(--chrome);box-shadow:var(--shadow),0 0 0 1px var(--chrome-line);cursor:default}
.pw.current{box-shadow:var(--shadow),0 0 0 3px var(--accent)}
.pw.collapsed{height:auto!important}
.pw.collapsed .pw-body,.pw.collapsed .pw-resize{display:none}
.pw-bar{display:flex;align-items:center;gap:10px;height:40px;padding:0 12px;background:var(--chrome-2);border-bottom:1px solid var(--chrome-line);cursor:grab;user-select:none;touch-action:none;flex:none;font-size:14px}
.pw-bar:active{cursor:grabbing}
.lights{display:flex;gap:8px;flex:none}
.light{position:relative;width:13px;height:13px;border-radius:50%;border:0;padding:0;cursor:pointer}
.light.close{background:#ff5f57}.light.min{background:#febc2e}.light.max{background:#28c840}
.light::after{content:attr(data-glyph);position:absolute;inset:0;display:grid;place-items:center;font:700 10px/1 var(--font-ui);color:rgba(0,0,0,.6);opacity:0}
.lights:hover .light::after,.light:focus-visible::after{opacity:1}
.pw-title{font-weight:650;color:var(--chrome-fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pill{flex:none;display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:650;background:var(--panel);color:var(--muted);border:1px solid var(--line)}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.pill[data-s="running"]{background:var(--run-soft);color:var(--run);border-color:var(--run-ring)}
.pill[data-s="running"]::before{animation:pulse 1s ease-in-out infinite}
.pill[data-s="needs"]{background:var(--orch-soft);color:var(--orch);border-color:var(--orch)}
.pill[data-s="idle"]{background:var(--ok-soft);color:var(--ok);border-color:var(--ok-ring)}
.pw-meta{margin-left:auto;font:12px var(--font-mono);color:var(--chrome-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pw-focus{flex:none;border:1px solid var(--chrome-line);background:var(--panel);border-radius:6px;padding:2px 9px;font-size:12px;cursor:pointer}
.pw-body{position:relative;flex:1;min-height:0}
.pw-body iframe{display:block;width:100%;height:100%;border:0;background:var(--chrome)}
.pw-shield{position:absolute;inset:0;display:none;cursor:zoom-in;background:transparent}
.ws.far .pw-shield{display:block}
.pw-resize{position:absolute;right:0;bottom:0;width:22px;height:22px;cursor:nwse-resize;touch-action:none;background:linear-gradient(135deg,transparent 0 55%,var(--chrome-line) 55% 62%,transparent 62% 72%,var(--chrome-line) 72% 79%,transparent 79%)}
.ws.dragging iframe{pointer-events:none}
@keyframes pulse{50%{opacity:.35}}

.zoomctl{position:absolute;right:14px;bottom:14px;z-index:40;display:flex;align-items:center;gap:2px;padding:4px;border-radius:10px;background:var(--bar-bg);backdrop-filter:blur(12px);box-shadow:var(--shadow),0 0 0 1px var(--bar-line)}
.zoomctl button{min-width:30px;height:28px;border:0;border-radius:7px;background:transparent;cursor:pointer;font-size:14px;color:var(--bar-fg)}
.zoomctl button:hover{background:var(--bar-line)}
.zoomctl .pct{min-width:52px;font:12px var(--font-mono)}
.hintbar{position:absolute;left:14px;bottom:14px;z-index:40;max-width:calc(100% - 290px);padding:5px 10px;border-radius:9px;background:var(--bar-bg);backdrop-filter:blur(12px);box-shadow:0 0 0 1px var(--bar-line);color:var(--bar-muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ws.single .zoomctl,.ws.single .hintbar{display:none}
.ws.single .canvas{background-image:none;cursor:default}
.ws.single .world{transform:none!important;width:100%;height:100%}
.ws.single .pw{display:none}
.ws.single .pw.current{display:flex;left:0!important;top:0!important;width:100%!important;height:100%!important;border-radius:0;box-shadow:none}
.ws.single .pw.current .pw-resize{display:none}
.ws.single.plain .pw.current .pw-bar{display:none}
.wtoast{position:absolute;left:50%;top:44px;transform:translateX(-50%);z-index:300;display:flex;align-items:center;gap:10px;max-width:calc(100% - 32px);padding:8px 10px 8px 14px;border-radius:10px;background:var(--fg);color:var(--panel);font-size:13px;box-shadow:var(--shadow)}
.wtoast button{border:0;border-radius:6px;padding:3px 10px;background:var(--panel);color:var(--fg);cursor:pointer;font-size:12px;flex:none}
.wsheet{position:fixed;inset:0;z-index:400;display:grid;place-items:center;padding:16px;background:var(--scrim)}
.wsheet>div{width:100%;max-width:620px;max-height:86%;overflow:auto;padding:18px 20px;background:var(--panel);border-radius:14px;box-shadow:var(--shadow);line-height:1.5}
.wsheet h2{margin:0 0 8px;font-size:17px}
.wsheet table{width:100%;border-collapse:collapse;font-size:13px}
.wsheet td{padding:4px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.wsheet td:first-child{font:12px var(--font-mono);white-space:nowrap;color:var(--accent)}
.wsheet ul{padding-left:18px;margin:0 0 10px}
.wsheet .row{display:flex;justify-content:flex-end;margin-top:12px}
.wsheet .row button{border:1px solid var(--accent);background:var(--accent);color:var(--accent-fg);border-radius:8px;padding:6px 14px;cursor:pointer;font-weight:600}
.ws.dbg [data-dbg]{outline:1px dashed var(--dbg);outline-offset:-1px}
.ws.dbg .wbar [data-dbg],.ws.dbg .zoomctl,.ws.dbg .pw-bar{position:relative}
.ws.dbg [data-dbg]::after{content:attr(data-dbg);position:absolute;left:2px;top:2px;z-index:999;padding:1px 5px;border-radius:3px;background:var(--dbg);color:#fff;font:600 10px/1.35 var(--font-mono);pointer-events:none;white-space:nowrap}
.ws.dbg .pw[data-dbg]::after{top:44px}
@media (max-width:720px){
  .menus [data-m="edit"],.menus [data-m="project"],.menus [data-m="help"],.wbar .stat,.hintbar{display:none}
  .wbar{gap:2px;padding:2px 8px}
  .pw-meta{display:none}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<div class="ws" id="ws">
  <div class="wbar" data-dbg="shell-menubar">
    <span class="logo">◆ multi-ai</span>
    <nav class="menus" id="menus" aria-label="Menu bar"></nav>
    <span class="spacer"></span>
    <button type="button" class="needs none" id="needsBtn" data-dbg="needs-you" title="Jump to the next project that is waiting for you">0 need you</button>
    <span class="stat" id="wsSpend" title="Total spend across all projects"></span>
    <span class="stat clock" id="wsClock"></span>
  </div>
  <div class="canvas" id="canvas" data-dbg="canvas">
    <div class="world" id="world"></div>
    <div class="hintbar" id="hintbar">Drag empty space to pan · ⌘/Ctrl + scroll to zoom · double-click a title bar to focus a project</div>
    <div class="zoomctl" data-dbg="zoom-controls" role="group" aria-label="Zoom">
      <button type="button" id="zOut" aria-label="Zoom out" title="Zoom out (⌘/Ctrl −)">−</button>
      <button type="button" class="pct" id="zPct" title="Zoom to 100% on the current project">50%</button>
      <button type="button" id="zIn" aria-label="Zoom in" title="Zoom in (⌘/Ctrl +)">+</button>
      <button type="button" id="zFit" title="Fit every project (⌘/Ctrl 0)">Fit all</button>
    </div>
  </div>
</div>

<template id="projectTemplate">
<style>

   Floating windows (the experiment repo and any number of file/artifact viewers) move anywhere on the screen
   and follow a time-travel cursor over the repo's commits. */

  --tt-soft:#e6edf4;
  --add-bg:#dcf3d6; --add-fg:#0b4d12; --add-mark:#a8e19c; --del-bg:#f8dcd8; --del-fg:#7a1f17; --del-mark:#efaaa2;

}

}

  --bar-bg:rgba(28,31,35,.88); --bar-fg:#eef1f3; --bar-muted:#a3acb4; --bar-line:rgba(255,255,255,.10);

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--wall-2);color:var(--fg);font-family:var(--font-ui);font-size:13px}
button,input,select,textarea{font:inherit;color:inherit}
form{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{position:relative;height:100%;min-height:640px;display:flex;flex-direction:column;overflow:hidden}

/* Menu bar */
.menubar{position:relative;display:flex;align-items:center;gap:14px;min-height:30px;padding:3px 16px;background:var(--bar-bg);color:var(--bar-fg);border-bottom:1px solid var(--bar-line);backdrop-filter:blur(14px);font-size:12.5px;white-space:nowrap}
.menubar .app-name{font-weight:650}
.menubar .session{color:var(--bar-muted);overflow:hidden;text-overflow:ellipsis;min-width:0}
.menubar .spacer{flex:1}
.budget{display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.budget input{width:58px;padding:1px 4px;border:1px solid var(--bar-line);border-radius:5px;background:transparent;font-variant-numeric:tabular-nums}
.meter{width:64px;height:6px;border-radius:3px;background:var(--bar-line);overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--ok-ring);transition:width .2s}
.budget[data-level="warn"] .meter i{background:var(--run-ring)}
.budget[data-level="over"] .meter i{background:var(--stop-ring)}
.budget[data-level="over"] .spent{color:var(--stop)}
.clock{font-variant-numeric:tabular-nums}

/* Desktop + browser */
.desktop{position:relative;flex:1;min-height:0;background:
  radial-gradient(120% 90% at 85% 10%,var(--wall-3) 0%,transparent 55%),
  linear-gradient(160deg,var(--wall-1) 0%,var(--wall-2) 100%)}
.browser{position:absolute;inset:12px 16px 14px;display:flex;flex-direction:column;background:var(--chrome);border-radius:var(--r-win);overflow:hidden;box-shadow:var(--shadow),0 0 0 1px var(--chrome-line)}
.topbar{display:flex;align-items:flex-end;gap:12px;padding:8px 10px;background:var(--chrome-2)}
.lights{display:flex;gap:7px;align-self:center;flex:none}
.light{position:relative;width:12px;height:12px;border-radius:50%;border:0;padding:0}
.light.close{background:#ff5f57}.light.min{background:#febc2e}.light.max{background:#28c840}
button.light{cursor:pointer}
button.light::after{content:attr(data-glyph);position:absolute;inset:0;display:grid;place-items:center;font:700 10px/1 var(--font-ui);color:rgba(0,0,0,.6);opacity:0}
.lights:hover button.light::after,button.light:focus-visible::after{opacity:1}
.toolbar{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px}
.toolbar .field{flex:1 1 300px;min-width:0}
.toolbar label{display:block;font-size:10.5px;font-weight:650;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:0 0 3px 4px}
.toolbar textarea{width:100%;min-height:40px;max-height:150px;resize:vertical;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);line-height:1.4}
.toolbar textarea:focus{outline:none;border-color:var(--accent)}
.toolbar textarea[readonly]{background:var(--tt-soft);border-color:var(--tt)}
.tb-actions{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tabbar{display:flex;align-items:flex-end;gap:6px;min-height:40px;padding:0 10px;background:var(--chrome-2);border-bottom:1px solid var(--chrome-line)}
.tabs{display:flex;align-items:flex-end;gap:4px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none;padding-top:4px}
.vtab{position:relative;display:flex;align-items:center;flex:0 1 230px;min-width:120px;height:34px;border-radius:9px 9px 0 0;background:var(--chrome);color:var(--chrome-fg);border:1px solid var(--chrome-line);border-bottom:0}
.vtab::before{content:"";position:absolute;left:0;right:0;top:-1px;height:3px;border-radius:9px 9px 0 0;background:var(--idle)}
.vtab[data-status="run"]{background:var(--run-soft)} .vtab[data-status="run"]::before{background:var(--run-ring)}
.vtab[data-status="done"]{background:var(--ok-soft)} .vtab[data-status="done"]::before{background:var(--ok-ring)}
.vtab[data-status="stop"]{background:var(--stop-soft)} .vtab[data-status="stop"]::before{background:var(--stop-ring)}
.vtab[aria-selected="true"]{box-shadow:inset 0 0 0 2px var(--accent);font-weight:600}
.vtab.ghost{border-style:dashed;opacity:.8}
.vtab-main{display:flex;align-items:center;gap:7px;flex:1;min-width:0;height:100%;padding:0 4px 0 10px;border:0;background:none;cursor:pointer;text-align:left;font-size:12px}
.vtab-main .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--idle);flex:none}
[data-status="run"] .dot{background:var(--run-ring);animation:pulse 1s ease-in-out infinite}
[data-status="done"] .dot{background:var(--ok-ring)}
[data-status="stop"] .dot{background:var(--stop-ring)}
.fav{display:grid;place-items:center;width:18px;height:18px;border-radius:5px;font:700 9px/1 var(--font-ui);background:var(--chrome-line);color:var(--chrome-fg);flex:none}
.vtab-x{flex:none;width:22px;height:22px;margin-right:5px;border:0;border-radius:6px;background:none;color:var(--chrome-muted);cursor:pointer;font-size:15px;line-height:1}
.vtab-x:hover{background:var(--chrome-line);color:var(--chrome-fg)}
.vtab-x:disabled{visibility:hidden}
.newtab{align-self:center;flex:none;height:28px;padding:0 10px;border:1px dashed var(--chrome-line);border-radius:8px;background:transparent;color:var(--chrome-fg);cursor:pointer;font-size:12px;white-space:nowrap}
.newtab:hover{background:var(--chrome)}
.newtab:disabled{opacity:.5;cursor:not-allowed}
.view{align-self:center;flex:none;display:inline-flex;border:1px solid var(--chrome-line);border-radius:7px;overflow:hidden}
.view button{border:0;background:transparent;padding:3px 9px;cursor:pointer;font-size:12px;color:var(--chrome-muted)}
.view button[aria-pressed="true"]{background:var(--tab);color:var(--chrome-fg);font-weight:600}
@keyframes pulse{50%{opacity:.35}}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 11px;cursor:pointer;white-space:nowrap;font-size:12.5px}
.btn:hover{background:var(--panel-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
.btn.primary:hover{filter:brightness(1.06)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.danger{border-color:var(--stop-ring);color:var(--stop)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.tt{border-color:var(--tt);color:var(--tt)}
.btn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.count{font:11px var(--font-mono);padding:0 5px;border-radius:999px;background:var(--line);color:var(--fg)}
kbd{font:11px var(--font-mono);padding:1px 5px;border-radius:4px;border:1px solid currentColor;opacity:.8}
.capbar{display:flex;align-items:center;padding:7px 12px;background:var(--stop-soft);color:var(--stop);border-bottom:1px solid var(--stop-ring);font-weight:550;line-height:1.4}
.ttbanner{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:7px 12px;background:var(--tt-soft);border-bottom:1px solid var(--tt);font-size:12.5px;line-height:1.4}
.ttbanner .txt{flex:1;min-width:220px}
.ttbanner b{color:var(--tt)}

.panes{flex:1;min-height:0;min-width:0;display:grid;gap:10px;padding:10px;overflow:auto;background:var(--chrome)}
.empty-panes{grid-column:1/-1;display:grid;place-items:center;color:var(--muted);text-align:center;line-height:1.5}
.pane{display:flex;flex-direction:column;min-width:0;min-height:0;border-radius:8px;overflow:hidden;background:var(--panel);box-shadow:0 0 0 1px var(--chrome-line);transition:box-shadow .25s}
.pane[data-status="run"]{box-shadow:0 0 0 2.5px var(--run-ring)}
.pane[data-status="done"]{box-shadow:0 0 0 2.5px var(--ok-ring)}
.pane[data-status="stop"]{box-shadow:0 0 0 2.5px var(--stop-ring)}
.pane.ghost{outline:2px dashed var(--muted);outline-offset:-2px;opacity:.85}
.app.past .pane-head{background:var(--tt-soft)}
.pane-head{display:flex;align-items:center;gap:8px;padding:5px 8px;background:var(--panel-2);border-bottom:1px solid var(--line);font-size:11.5px;color:var(--muted);white-space:nowrap}
.pane-head .who{font-weight:650;color:var(--fg)}
.pane-head .ep{font-family:var(--font-mono);font-size:10.5px;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.badge{flex:none;font-size:10.5px;font-weight:650;padding:1px 7px;border-radius:999px}
.badge.free{background:var(--ok-soft);color:var(--ok)}
.badge.paused{background:var(--stop-soft);color:var(--stop)}
.badge.past{background:var(--panel);color:var(--tt);border:1px solid var(--tt)}
.tool{flex:none;border:1px solid var(--line);background:transparent;border-radius:6px;padding:1px 8px;cursor:pointer;font-size:11px}
.tool[aria-expanded="true"]{border-color:var(--accent);color:var(--accent)}
.wstatus{display:flex;gap:12px;padding:4px 10px;background:var(--panel-2);border-top:1px solid var(--line);color:var(--muted);font:11px var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden}
.wstatus .st{font-weight:600;color:var(--idle)}
.pane[data-status="run"] .wstatus .st{color:var(--run)}
.pane[data-status="done"] .wstatus .st{color:var(--ok)}
.pane[data-status="stop"] .wstatus .st{color:var(--stop)}

/* Provider-styled pages (layout approximations for planning) */
.page{--p-bg:#ffffff;--p-fg:#1f1f1f;--p-muted:#6b6b6b;--p-user:#f1f1f1;--p-line:#e5e5e5;--p-composer:#ffffff;--p-accent:#1f1f1f;--p-font:var(--font-ui);
  flex:1;min-height:0;display:flex;flex-direction:column;background:var(--p-bg);color:var(--p-fg)}
.page[data-skin="claude"]{--p-bg:#faf9f5;--p-fg:#29261b;--p-muted:#77746a;--p-user:#efece3;--p-line:#e2ded3;--p-composer:#ffffff;--p-accent:#bf5b37;--p-font:var(--font-serif)}
.page[data-skin="gemini"]{--p-user:#e9eef6;--p-line:#e1e5eb;--p-accent:#1b66d2}
.page[data-skin="grok"]{--p-bg:#151515;--p-fg:#ececec;--p-muted:#9b9b9b;--p-user:#2a2a2a;--p-line:#303030;--p-composer:#1f1f1f;--p-accent:#ececec}
.page[data-skin="owui"]{--p-user:#f0f0f2;--p-accent:#3b3b3b}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .page{--p-bg:#212121;--p-fg:#ececec;--p-muted:#a3a3a3;--p-user:#303030;--p-line:#383838;--p-composer:#2a2a2a;--p-accent:#ececec}
  :root:not([data-theme="light"]) .page[data-skin="claude"]{--p-bg:#262624;--p-fg:#f2f0e8;--p-muted:#a8a598;--p-user:#383733;--p-line:#3e3d38;--p-composer:#30302d;--p-accent:#d97a52}
  :root:not([data-theme="light"]) .page[data-skin="gemini"]{--p-bg:#1b1c1d;--p-user:#2a2c2f;--p-line:#333538;--p-composer:#232426;--p-accent:#8ab4f8}
  :root:not([data-theme="light"]) .page[data-skin="grok"]{--p-bg:#141414;--p-user:#2a2a2a;--p-composer:#1e1e1e}
  :root:not([data-theme="light"]) .page[data-skin="owui"]{--p-bg:#171717;--p-user:#262626;--p-composer:#202020}
}
:root[data-theme="dark"] .page{--p-bg:#212121;--p-fg:#ececec;--p-muted:#a3a3a3;--p-user:#303030;--p-line:#383838;--p-composer:#2a2a2a;--p-accent:#ececec}
:root[data-theme="dark"] .page[data-skin="claude"]{--p-bg:#262624;--p-fg:#f2f0e8;--p-muted:#a8a598;--p-user:#383733;--p-line:#3e3d38;--p-composer:#30302d;--p-accent:#d97a52}
:root[data-theme="dark"] .page[data-skin="gemini"]{--p-bg:#1b1c1d;--p-user:#2a2c2f;--p-line:#333538;--p-composer:#232426;--p-accent:#8ab4f8}
:root[data-theme="dark"] .page[data-skin="grok"]{--p-bg:#141414;--p-user:#2a2a2a;--p-composer:#1e1e1e}
:root[data-theme="dark"] .page[data-skin="owui"]{--p-bg:#171717;--p-user:#262626;--p-composer:#202020}
.ptop{display:flex;align-items:center;gap:8px;min-height:34px;padding:4px 14px;font-size:13px;color:var(--p-muted)}
.ptop .title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick{border:0;background:transparent;color:var(--p-fg);padding:3px 4px;border-radius:6px;cursor:pointer;max-width:100%;font-weight:600}
.pick:hover{background:var(--p-user)}
.pick:disabled{cursor:default;opacity:.9}
.pick option{color:#111;background:#fff}
.thread{flex:1;min-height:0;overflow-y:auto;padding:4px 16px 10px;display:flex;flex-direction:column;gap:12px}
.greet{margin:auto;text-align:center;font-family:var(--p-font);font-size:22px;line-height:1.3;padding:12px;text-wrap:balance}
.greet small{display:block;font-family:var(--font-ui);font-size:12px;color:var(--p-muted);margin-top:6px}
.rundiv{display:flex;align-items:center;gap:8px;font:10.5px var(--font-ui);letter-spacing:.04em;text-transform:uppercase;color:var(--p-muted)}
.rundiv::before,.rundiv::after{content:"";flex:1;height:1px;background:var(--p-line)}
.msg-user{align-self:flex-end;max-width:85%;padding:8px 13px;border-radius:18px;background:var(--p-user);white-space:pre-wrap;word-wrap:break-word;font-family:var(--font-ui);line-height:1.45}
.page[data-skin="claude"] .msg-user{align-self:flex-start;border-radius:12px}
.msg-ai{font-family:var(--p-font);font-size:14px;line-height:1.62;min-width:0}
.msg-ai p{margin:0 0 .7em}
.msg-ai ul{margin:0 0 .7em;padding-left:1.2em}
.msg-ai code{font:12px var(--font-mono);background:var(--p-user);padding:1px 4px;border-radius:4px}
.msg-ai pre{margin:0 0 .7em;padding:10px 12px;border-radius:10px;background:var(--p-user);overflow-x:auto}
.msg-ai pre code{background:none;padding:0;font-size:11.5px}
.toolrow{display:inline-block;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:6px;padding:3px 9px;border:1px solid var(--p-line);border-radius:999px;font:11.5px var(--font-ui);color:var(--p-muted)}
.toolrow b{color:var(--p-fg);font-weight:600}
.thought{display:flex;align-items:center;gap:5px;margin-bottom:6px;padding:0;border:0;background:none;cursor:pointer;font:12.5px var(--font-ui);color:var(--p-muted)}
.thought:disabled{cursor:default}
.thought .chev{display:inline-block;transition:transform .15s}
.thought[aria-expanded="true"] .chev{transform:rotate(90deg)}
.thought.live{cursor:default;background:linear-gradient(90deg,var(--p-muted) 0%,var(--p-fg) 50%,var(--p-muted) 100%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 1.4s linear infinite}
@keyframes shimmer{to{background-position:-200% 0}}
.thought-body{margin:0 0 10px;padding:2px 0 2px 10px;border-left:2px solid var(--p-line);font:12.5px/1.55 var(--font-ui);color:var(--p-muted);white-space:pre-wrap}
.thought-body.raw{font-family:var(--font-mono);font-size:11.5px}
.cursor::after{content:"";display:inline-block;width:7px;height:1em;margin-left:2px;vertical-align:-2px;background:var(--p-fg);animation:pulse .9s steps(2) infinite}
.artifact{display:flex;align-items:center;gap:10px;margin:2px 0 8px;padding:8px 10px;border:1px solid var(--p-line);border-radius:10px;font:12.5px var(--font-ui)}
.artifact .meta{color:var(--p-muted);flex:1;min-width:0}
.artifact button{border:1px solid var(--p-line);background:var(--p-bg);color:var(--p-fg);border-radius:8px;padding:3px 9px;cursor:pointer;font:inherit}
.msg-tools{display:flex;gap:12px;font:11.5px var(--font-ui);color:var(--p-muted)}
.msg-tools button{border:0;background:none;padding:0;color:inherit;cursor:pointer}
.msg-tools button:hover{color:var(--p-fg)}
.notice{font:12px var(--font-ui);color:var(--stop);border:1px solid var(--stop-ring);border-radius:8px;padding:6px 10px}
.composer{margin:4px 12px 12px;padding:10px 12px 8px;border:1px solid var(--p-line);border-radius:18px;background:var(--p-composer);display:flex;flex-direction:column;gap:8px}
.mirror{min-height:20px;max-height:62px;overflow:hidden;white-space:pre-wrap;word-wrap:break-word;line-height:1.4;font-family:var(--font-ui)}
.mirror.ph{color:var(--p-muted)}
.mirror.typing::after{content:"";display:inline-block;width:1.5px;height:1em;margin-left:1px;vertical-align:-2px;background:var(--p-fg);animation:pulse .9s steps(2) infinite}
.opts{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-family:var(--font-ui)}
.opts .pick{font-weight:500;font-size:12px;color:var(--p-muted);border:1px solid var(--p-line);border-radius:999px;padding:2px 6px}
.fixed{font-size:12px;color:var(--p-muted);padding:2px 8px;border:1px dashed var(--p-line);border-radius:999px}
.pill{border:1px solid var(--p-line);background:transparent;border-radius:999px;padding:3px 10px;font-size:12px;color:var(--p-muted);cursor:pointer}
.pill[aria-pressed="true"]{color:var(--p-accent);border-color:var(--p-accent)}
.pill:disabled{cursor:default}
.mcpchip{font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--p-user);color:var(--p-fg)}
.senddot{margin-left:auto;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--p-accent);color:var(--p-bg);font-weight:700;flex:none}
.page[data-skin="claude"] .senddot{border-radius:9px}

.trace{display:flex;flex-direction:column;max-height:44%;min-height:120px;border-top:1px solid var(--line);background:var(--panel)}
.trace-head{display:flex;gap:8px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--line)}
.trace-head input{flex:1;min-width:0;padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel-2);font-size:12px}
.trace-head span{font:11px var(--font-mono);color:var(--muted)}
.trace-list{list-style:none;margin:0;padding:4px 0;overflow:auto;font:11px/1.5 var(--font-mono)}
.trace-list li{display:grid;grid-template-columns:92px 74px 1fr;gap:8px;padding:1px 10px}
.trace-list li:nth-child(odd){background:var(--panel-2)}
.trace-list .ty{color:var(--accent)}
.trace-list .dt{overflow-wrap:anywhere}

/* Floating windows */
.fw{position:absolute;z-index:40;display:flex;flex-direction:column;background:var(--panel);border-radius:var(--r-win);box-shadow:var(--shadow),0 0 0 1px var(--chrome-line);overflow:hidden;resize:both;min-width:300px;min-height:200px}
.fw.max{left:16px!important;top:36px!important;right:16px;bottom:30px;width:auto!important;height:auto!important;resize:none}
.fw-bar{display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;background:var(--chrome-2);border-bottom:1px solid var(--chrome-line);cursor:grab;user-select:none;touch-action:none;flex:none}
.fw-bar:active{cursor:grabbing}
.fw-title{font-weight:650;font-size:12.5px;color:var(--chrome-fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.branch{font:11px var(--font-mono);padding:1px 8px;border-radius:999px;background:var(--panel);border:1px solid var(--chrome-line);color:var(--chrome-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;margin-left:auto}
.app.past .fw .branch{border-color:var(--tt);color:var(--tt)}
.fwbody{flex:1;min-height:0;display:flex;flex-direction:column}
.tt{display:flex;align-items:center;gap:6px;padding:6px 10px;border-bottom:1px solid var(--line);background:var(--panel-2);flex:none}
.tt .lbl{font-size:11px;font-weight:650;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);flex:none}
.tt input[type="range"]{flex:1;min-width:60px;accent-color:var(--tt)}
.tt button{flex:none;min-width:26px;height:24px;border:1px solid var(--line);border-radius:6px;background:var(--panel);cursor:pointer}
.ttl{font:11px var(--font-mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40%}
.app.past .ttl{color:var(--tt);font-weight:600}
.rtabs{display:flex;gap:2px;padding:4px 10px 0;border-bottom:1px solid var(--line);background:var(--panel);flex:none}
.rtabs button{border:0;border-bottom:2px solid transparent;background:none;padding:7px 10px 6px;cursor:pointer;color:var(--muted);font-size:12.5px;white-space:nowrap}
.rtabs button[aria-selected="true"]{color:var(--fg);font-weight:600;border-bottom-color:var(--accent)}
.rview{flex:1;min-height:0;overflow:auto}
.rview.files{display:flex;flex-direction:column;overflow:hidden}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;padding:8px 12px;border-bottom:1px solid var(--line);font-size:11px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.kind{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:6px;font:700 11px/1 var(--font-mono);font-style:normal;color:#fff;background:var(--k-init);flex:none}
.legend .kind,.changes .kind{width:16px;height:16px;font-size:9.5px;border-radius:4px}
.kind[data-k="prompt"],.kind[data-k="rerun"]{background:var(--k-prompt)}
.kind[data-k="config"]{background:var(--k-config)}
.kind[data-k="mcp"]{background:var(--k-mcp)}
.kind[data-k="tool"]{background:var(--k-tool)}
.kind[data-k="run"]{background:var(--k-run)}
.kind[data-k="stop"]{background:var(--stop-ring)}
.kind[data-k="restore"]{background:var(--tt)}
.kind[data-k="reset"]{background:var(--k-init)}
.kind[data-k="pending"]{background:var(--run-ring);animation:pulse 1s infinite}
.wc{margin:10px 12px;border:1.5px dashed var(--line);border-radius:10px;padding:10px}
.wc.dirty{border-color:var(--accent)}
.wc.past{border-color:var(--tt);background:var(--tt-soft)}
.wc h3{margin:0 0 4px;font-size:12.5px}
.wc p{margin:0;color:var(--muted);font-size:12px;line-height:1.45}
.wc .row{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 2px}
.changes{margin:6px 0 8px;padding:0;list-style:none;font-size:12.5px;display:flex;flex-direction:column;gap:3px}
.changes li{display:flex;gap:7px;align-items:flex-start}
.changes .kind{margin-top:1px}
.commits{list-style:none;margin:0;padding:0}
#commits{padding-bottom:12px}
.cm{border-top:1px solid var(--line)}
.cm.fresh{animation:fresh .6s ease-out}
.cm.future{opacity:.42}
.cm.sel{background:var(--tt-soft);box-shadow:inset 3px 0 var(--tt)}
@keyframes fresh{from{background:var(--panel-2)}}
.cm-head{display:grid;grid-template-columns:20px 1fr;gap:4px 9px;width:100%;padding:9px 12px;border:0;background:none;text-align:left;cursor:pointer}
.cm-head:hover{background:var(--panel-2)}
.cm-title{font-size:12.5px;line-height:1.4}

/* ---------- restore / reset / commit without running ---------- */
function restoreSnap(snap, prompt) {

  snap.tabs.forEach((w) => {
    let t = st.tabs.find((x) => pad(x.id) === w.id);
    if (!t) { t = st.closed.find((x) => pad(x.id) === w.id); if (t) revive(t); else t = addTab(w.api, w.model, w.raw); }
    if (!t) return;
    t.model = t.p.models.find((m) => m.id === w.model) || t.model; t.reason = w.raw; t.web = w.web;
  });
  st.mcp = new Set(snap.mcp); $('#mcpCount').textContent = String(st.mcp.size);
  st.cap = snap.cap; $('#cap').value = st.cap.toFixed(2);
  promptEl.value = F.promptPrefill === 'on' ? prompt : (prompt === st.head.prompt ? '' : prompt);

}
function restore(c, branch) {

  toast(branch ? `On branch ${st.branch}. The state from ${c.sha} is staged; Send or Commit records it, Reset undoes it.` : `The state from ${c.sha} is staged as unsent changes. Commit or Send to record it, or Reset to undo it.`);
}
function resetWorking() {

  st.commits.forEach((x) => { x.open = false; });
  addCommit({ kind: 'reset', title: `You reset ${ch.length} unsent change${ch.length === 1 ? '' : 's'} back to ${headSha}`, short: `Reset ${ch.length} unsent change${ch.length === 1 ? '' : 's'}`, changes: ch, files: [] });

}
function commitWorking(text, ts, forRun) {

  const version = text !== st.head.prompt ? st.head.version + 1 : st.head.version;

}

function place(p) { Object.assign(p.el.style, { left: p.x + 'px', top: p.y + 'px', width: p.w + 'px', height: p.h + 'px' }); }
function setCurrent(p) {
  if (cur === p) return;
  cur = p; P.forEach((q) => q.el.classList.toggle('current', q === p));
  if (F.workspace === 'single') paintSingle();
}
function closeProject(p) {
  p.state = 'closed'; p.el.hidden = true;
  if (cur === p) { cur = null; const o = P.find((q) => q.state === 'open'); if (o) setCurrent(o); }
  paintWindows(); toast(`Closed ${p.title}. It keeps running; reopen it from the Window menu.`);
}
function reopen(p) { p.state = 'open'; p.el.hidden = false; setCurrent(p); focusProject(p, true); paintWindows(); }
function cmd(name, arg, p = cur) { if (p) p.frame.contentWindow.postMessage({ mai: 'cmd', name, arg }, '*'); else toast('Open a project first.'); }
function broadcast(msg, except) { P.forEach((p) => { if (p !== except) p.frame.contentWindow.postMessage(msg, '*'); }); }

/* ---------- canvas: pan and zoom ---------- */
const view = { x: 40, y: 40, z: 0.5 };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function applyView(anim) {
  world.style.transition = anim ? 'transform .35s ease' : 'none';
  world.style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.z})`;
  const g = 24 * view.z;
  canvas.style.backgroundSize = `${g}px ${g}px`; canvas.style.backgroundPosition = `${view.x}px ${view.y}px`;
  $('#zPct').textContent = Math.round(view.z * 100) + '%';
  ws.classList.toggle('far', view.z < 0.3);
}
function zoomAt(sx, sy, factor, anim) {
  const z2 = clamp(view.z * factor, 0.1, 1.6), wx = (sx - view.x) / view.z, wy = (sy - view.y) / view.z;
  view.x = sx - wx * z2; view.y = sy - wy * z2; view.z = z2; applyView(anim);
}
function zoomCenter(f) { zoomAt(canvas.clientWidth / 2, canvas.clientHeight / 2, f, true); }
function bounds(list = P.filter((p) => p.state === 'open')) {
  if (!list.length) return null;
  const x0 = Math.min(...list.map((p) => p.x)), y0 = Math.min(...list.map((p) => p.y));
  const x1 = Math.max(...list.map((p) => p.x + p.w)), y1 = Math.max(...list.map((p) => p.y + (p.el.offsetHeight || p.h)));
  return { x: x0, y: y0, w: x1 - x0, h: y1 - y0 };
}
function fit(r, anim, maxZ = 1) {
  if (!r) return;
  const cw = canvas.clientWidth, ch = canvas.clientHeight, pad = cw < 720 ? 12 : 36;
  view.z = clamp(Math.min((cw - 2 * pad) / r.w, (ch - 2 * pad - 30) / r.h), 0.1, maxZ);
  view.x = (cw - r.w * view.z) / 2 - r.x * view.z; view.y = (ch - 30 - r.h * view.z) / 2 - r.y * view.z;
  applyView(anim);
}
function fitAll(anim = true) { fit(bounds(), anim); }
function focusProject(p, anim) {
  if (!p) return;

  p.el.classList.remove('collapsed'); setCurrent(p);
  if (F.workspace === 'single') return;
  fit({ x: p.x, y: p.y, w: p.w, h: p.h }, anim);
}
function dragger(handle, move, ok = () => true) {
  let last = null;
  handle.addEventListener('pointerdown', (e) => { if (e.button !== 0 || !ok(e) || F.workspace === 'single') return; last = { x: e.clientX, y: e.clientY }; handle.setPointerCapture(e.pointerId); ws.classList.add('dragging'); e.preventDefault(); e.stopPropagation(); });
  handle.addEventListener('pointermove', (e) => { if (!last) return; move(e.clientX - last.x, e.clientY - last.y); last = { x: e.clientX, y: e.clientY }; });
  const end = () => { last = null; ws.classList.remove('dragging'); };
  handle.addEventListener('pointerup', end); handle.addEventListener('pointercancel', end);
}
(() => {
  let pan = null;
  canvas.addEventListener('pointerdown', (e) => {
    if (F.workspace === 'single' || e.button !== 0 || !(e.target === canvas || e.target === world)) return;
    pan = { x: e.clientX, y: e.clientY }; canvas.setPointerCapture(e.pointerId); canvas.classList.add('panning'); ws.classList.add('dragging'); closeMenus();
  });
  canvas.addEventListener('pointermove', (e) => { if (!pan) return; view.x += e.clientX - pan.x; view.y += e.clientY - pan.y; pan = { x: e.clientX, y: e.clientY }; applyView(); });
  const end = () => { pan = null; canvas.classList.remove('panning'); ws.classList.remove('dragging'); };
  canvas.addEventListener('pointerup', end); canvas.addEventListener('pointercancel', end);
  canvas.addEventListener('wheel', (e) => {
    if (F.workspace === 'single') return;
    e.preventDefault();
    const r = canvas.getBoundingClientRect();
    if (e.ctrlKey || e.metaKey) zoomAt(e.clientX - r.left, e.clientY - r.top, Math.exp(-e.deltaY * 0.0022));
    else { view.x -= e.deltaX; view.y -= e.deltaY; applyView(); }
  }, { passive: false });
})();
$('#zIn').addEventListener('click', () => zoomCenter(1.25));
$('#zOut').addEventListener('click', () => zoomCenter(0.8));
$('#zFit').addEventListener('click', () => fitAll());
$('#zPct').addEventListener('click', () => { if (!cur) return; const cw = canvas.clientWidth; view.z = 1; view.x = (cw - cur.w) / 2 - cur.x; view.y = 16 - cur.y; applyView(true); });
function key(k) { if (k === '=' || k === '+') zoomCenter(1.25); else if (k === '-') zoomCenter(0.8); else if (k === '0') fitAll(); else if (k === '1') focusProject(cur, true); }
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && !e.altKey && ['=', '+', '-', '0', '1'].includes(e.key)) { e.preventDefault(); key(e.key); }
  if (e.key === 'Escape') { closeMenus(); const s = $('.wsheet'); if (s) s.remove(); }
});
// B-26: scrollIntoView inside a project also scrolls ancestors; keep the canvas and shell pinned.
[canvas, ws, document.scrollingElement].forEach((n) => n && n.addEventListener('scroll', () => { n.scrollLeft = 0; n.scrollTop = 0; }));

/* ---------- messages from projects ---------- */
window.addEventListener('message', (e) => {
  const d = e.data, p = d && P.find((q) => q.frame.contentWindow === e.source);
  if (!d || !d.mai || !p) return;
  if (d.mai === 'status') {
    const was = p.s.status; p.s = d;
    const words = { running: `Running · run ${d.run}`, needs: 'Needs you · suggestion ready', idle: 'Up to date' };
    p.pill.dataset.s = d.status; p.pill.textContent = words[d.status] || d.status;
    p.pill.title = d.status === 'needs' ? `The orchestrator suggests: ${d.suggestion}` : '';
    p.meta.textContent = [d.tt ? `viewing step ${d.tt} of ${d.steps}` : `${d.steps} steps`, `${d.run} run${d.run === 1 ? '' : 's'}`, d.checks && `checks ${d.checks}`, `$${d.spend.toFixed(3)}`].filter(Boolean).join(' · ');
    if (was === 'running' && d.status === 'needs') toast(`${p.title} needs you: the orchestrator suggested the next step.`, 'Show', () => focusProject(p, true));
    paintWindows();
  }
  if (d.mai === 'flag') { saveFlag(d.k, d.v); broadcast({ mai: 'flag', k: d.k, v: d.v }, p); applyShellFlags(); }
  if (d.mai === 'key') { setCurrent(p); key(d.key); }
  if (d.mai === 'focus') { setCurrent(p); closeMenus(); }
  if (d.mai === 'wheel' && F.workspace !== 'single') {
    const r = canvas.getBoundingClientRect(), b = p.frame.getBoundingClientRect();
    zoomAt(b.left - r.left + d.x * view.z, b.top - r.top + d.y * view.z, Math.exp(-d.dy * 0.0022));
  }
});

/* ---------- menu bar ---------- */
function flagItem(label, k, on, off) { return { l: label, check: F[k] === on, run: () => setShellFlag(k, F[k] === on ? off : on) }; }
function setShellFlag(k, v) { saveFlag(k, v); broadcast({ mai: 'flag', k, v }); applyShellFlags(); }
const MENUS = [
  ['file', 'File', () => [
    { l: 'New blank project', run: () => addProject({ story: 'blank', title: `Untitled experiment ${nextId}` }) },
    { l: 'New from example: Land or Water? (guided, from step 1)', run: () => addProject({ story: 'landwater', start: 'step1', title: 'Land or Water? · guided from step 1' }) },
    { l: 'New from example: pass@k vs pass^k', run: () => addProject({ story: 'passk', title: 'pass@k vs pass^k' }) },
    '-',
    { l: 'Duplicate project', dis: !cur, run: () => addProject({ story: cur.story, start: cur.start, title: `${cur.title} (copy)` }) },
    { l: 'Export project repo…', dis: !cur, run: () => cmd('export') },
    '-',
    { l: 'Close project', dis: !cur, run: () => closeProject(cur) },
  ]],
  ['edit', 'Edit', () => [
    { l: 'Use suggested prompt', dis: !(cur && cur.s.suggestion), run: () => cmd('useSuggestion') },
    { l: 'Dismiss suggestion', dis: !(cur && cur.s.suggestion), run: () => cmd('dismissSuggestion') },
    '-',
    { l: 'Reset unsent changes', run: () => cmd('reset') },
    { l: 'Commit without running', run: () => cmd('commitOnly') },
    '-',
    { l: 'Copy prompt', run: () => cmd('copyPrompt') },
    { l: 'Focus prompt bar', run: () => cmd('focusPrompt') },
  ]],
  ['view', 'View', () => [
    { l: 'Zoom in', k: `${MOD} +`, run: () => zoomCenter(1.25) },
    { l: 'Zoom out', k: `${MOD} −`, run: () => zoomCenter(0.8) },
    { l: 'Zoom to fit all projects', k: `${MOD} 0`, run: () => fitAll() },
    { l: 'Focus current project', k: `${MOD} 1`, dis: !cur, run: () => focusProject(cur, true) },
    '-',
    { l: 'Projects on a canvas', check: F.workspace === 'canvas', run: () => setShellFlag('workspace', 'canvas') },
    { l: 'One project fills the screen (v5)', check: F.workspace === 'single', run: () => setShellFlag('workspace', 'single') },
    '-',
    flagItem('Timeline ribbon', 'timeline', 'on', 'off'),
    flagItem('Panes scroll to latest in playback', 'ttScroll', 'bottom', 'keep'),
    flagItem('Element names overlay', 'debugIds', 'on', 'off'),
    '-',
    { l: 'Repo window', run: () => cmd('repo') },
    { l: 'Dock or float the repo window', run: () => cmd('dock') },
    { l: 'Artifacts window', run: () => cmd('arts') },
    { l: 'Tabs side by side', run: () => cmd('split') },
    { l: 'One tab at a time', run: () => cmd('one') },
  ]],
  ['project', 'Project', () => [
    { l: 'Send to every tab', k: `${MOD} ↵`, run: () => cmd('send') },
    { l: 'Stop all', dis: !(cur && cur.s.status === 'running'), run: () => cmd('stop') },
    { l: 'New variant tab…', run: () => cmd('newTab') },
    { l: 'MCP & tools…', run: () => cmd('mcp') },
    '-',
    { l: 'Step back in time', run: () => cmd('ttPrev') },
    { l: 'Step forward', run: () => cmd('ttNext') },
    { l: 'Play back history', run: () => cmd('ttPlay') },
    { l: 'Back to latest', run: () => cmd('ttBack') },
    '-',
    { l: 'Restore this state', run: () => cmd('restore') },
    { l: 'Branch from here', run: () => cmd('branch') },
  ]],
  ['window', 'Window', () => {
    const words = { running: 'running', needs: 'needs you', idle: 'up to date' };
    const open = P.filter((p) => p.state === 'open'), closed = P.filter((p) => p.state === 'closed');
    return [{ sec: 'Projects' }, ...open.map((p) => ({ l: p.title, sub: words[p.s.status] || '', check: p === cur, run: () => focusProject(p, true) })),
      ...(closed.length ? ['-', { sec: 'Closed' }, ...closed.map((p) => ({ l: p.title, sub: 'reopen', run: () => reopen(p) }))] : []),
      '-', { l: 'Arrange in a grid', run: arrange }, { l: 'Zoom to fit all projects', run: () => fitAll() }];
  }],
  ['help', 'Help', () => [
    { l: 'Flags & element names…', run: () => cmd('flags') },
    { l: 'Keyboard and mouse', run: showKeys },
    { l: "What's new in v6", run: showNew },
  ]],
];
let openMenu = null;
function closeMenus() { if (openMenu) { openMenu.pop.remove(); openMenu.btn.setAttribute('aria-expanded', 'false'); openMenu = null; } }
function showMenu(btn, def) {
  closeMenus();
  const pop = el('div', 'mpop'); pop.setAttribute('role', 'menu'); pop.dataset.dbg = `menu:${def[0]}`;
  def[2]().forEach((it) => {
    if (it === '-') { pop.appendChild(el('hr')); return; }
    if (it.sec) { pop.appendChild(el('div', 'sec', it.sec)); return; }
    const b = el('button'); b.type = 'button'; b.setAttribute('role', it.check != null ? 'menuitemcheckbox' : 'menuitem'); b.disabled = !!it.dis;
    if (it.check != null) b.setAttribute('aria-checked', String(!!it.check));
    b.append(el('span', 'ck', it.check ? '✓' : ''), el('span', 'lb', it.l));
    if (it.sub) b.appendChild(el('span', 'sub', it.sub));
    if (it.k) b.appendChild(el('kbd', null, it.k));
    b.addEventListener('click', () => { closeMenus(); it.run(); });
    pop.appendChild(b);
  });
  ws.appendChild(pop);
  const r = btn.getBoundingClientRect();
  pop.style.left = Math.max(8, Math.min(r.left, window.innerWidth - pop.offsetWidth - 8)) + 'px'; pop.style.top = (r.bottom + 2) + 'px';
  btn.setAttribute('aria-expanded', 'true');
  openMenu = { btn, pop };
  const first = pop.querySelector('button:not(:disabled)'); if (first) first.focus({ preventScroll: true });
}
MENUS.forEach((def) => {
  const b = el('button', 'mtop', def[1]); b.type = 'button'; b.dataset.m = def[0]; b.setAttribute('aria-haspopup', 'menu'); b.setAttribute('aria-expanded', 'false');
  b.addEventListener('click', (e) => { e.stopPropagation(); if (openMenu && openMenu.btn === b) closeMenus(); else showMenu(b, def); });
  b.addEventListener('pointerenter', () => { if (openMenu && openMenu.btn !== b) showMenu(b, def); });
  $('#menus').appendChild(b);
});
document.addEventListener('click', (e) => { if (openMenu && !openMenu.pop.contains(e.target)) closeMenus(); });
document.addEventListener('keydown', (e) => {
  if (!openMenu || !['ArrowDown', 'ArrowUp', 'ArrowLeft', 'ArrowRight'].includes(e.key)) return;
  e.preventDefault();
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
    const tops = [...document.querySelectorAll('.mtop')].filter((b) => b.offsetParent), i = tops.indexOf(openMenu.btn);
    const nb = tops[(i + (e.key === 'ArrowRight' ? 1 : -1) + tops.length) % tops.length]; showMenu(nb, MENUS.find((m) => m[0] === nb.dataset.m)); return;
  }
  const items = [...openMenu.pop.querySelectorAll('button:not(:disabled)')], i = items.indexOf(document.activeElement);
  items[(i + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length].focus();
});

/* ---------- windows, needs-you, totals ---------- */
function paintWindows() {
  const open = P.filter((p) => p.state === 'open'), needs = open.filter((p) => p.s.status === 'needs');
  const nb = $('#needsBtn');
  nb.textContent = needs.length ? `${needs.length} need${needs.length === 1 ? 's' : ''} you` : 'all up to date';
  nb.classList.toggle('none', !needs.length);
  nb.title = needs.length ? `Waiting for you: ${needs.map((p) => p.title).join(', ')}. Click to jump to the next one.` : 'No project is waiting for you';
  const spend = P.reduce((a, p) => a + (p.s.spend || 0), 0), running = open.filter((p) => p.s.status === 'running').length;
  $('#wsSpend').innerHTML = `${open.length} projects${running ? ` · <b>${running} running</b>` : ''} · spend <b>$${spend.toFixed(3)}</b>`;
}
$('#needsBtn').addEventListener('click', () => {
  const needs = P.filter((p) => p.state === 'open' && p.s.status === 'needs'); if (!needs.length) return;
  const i = needs.indexOf(cur); focusProject(needs[(i + 1) % needs.length], true);
});
function arrange() {
  const open = P.filter((p) => p.state === 'open'), cols = Math.ceil(Math.sqrt(open.length));
  let x = 0, y = 0, rowH = 0;
  open.forEach((p, i) => { if (i && i % cols === 0) { x = 0; y += rowH + 60; rowH = 0; } p.x = x; p.y = y; place(p); x += p.w + 60; rowH = Math.max(rowH, p.h); });
  fitAll();
}
function toast(msg, act, fn) {
  const old = $('.wtoast'); if (old) old.remove();
  const t = el('div', 'wtoast'); t.setAttribute('role', 'status'); t.appendChild(el('span', null, msg));
  if (act) { const b = el('button', null, act); b.type = 'button'; b.addEventListener('click', () => { t.remove(); fn(); }); t.appendChild(b); }
  ws.appendChild(t); setTimeout(() => t.remove(), 5200);
}
function sheet(title, html) {
  const o = el('div', 'wsheet'), box = el('div'); box.setAttribute('role', 'dialog'); box.setAttribute('aria-modal', 'true');
  box.innerHTML = `<h2>${title}</h2>${html}<div class="row"><button type="button">Close</button></div>`;
  o.appendChild(box); ws.appendChild(o);
  const close = () => o.remove(); $('button', box).addEventListener('click', close); o.addEventListener('click', (e) => { if (e.target === o) close(); });
  $('button', box).focus();
}
function showKeys() {
  sheet('Keyboard and mouse', `<table>
<tr><td>drag empty canvas</td><td>Pan</td></tr><tr><td>scroll / two fingers</td><td>Pan (over empty canvas)</td></tr>
<tr><td>${MOD} + scroll, pinch</td><td>Zoom at the pointer, also over a project</td></tr>
<tr><td>${MOD} + / ${MOD} −</td><td>Zoom in / out</td></tr><tr><td>${MOD} 0</td><td>Fit every project</td></tr><tr><td>${MOD} 1</td><td>Focus the current project</td></tr>
<tr><td>drag a title bar</td><td>Move a project; the corner resizes it</td></tr><tr><td>double-click a title bar</td><td>Focus that project</td></tr>
<tr><td>${MOD} Enter</td><td>Send the prompt to every tab (inside a project)</td></tr><tr><td>↑ ↓ in the prompt bar</td><td>Earlier prompts, then the suggestion</td></tr>
<tr><td>Esc</td><td>Close menus; leave playback</td></tr></table>`);
}
function showNew() {
  sheet("What's new in v6", `<ul>
<li><b>Project windows</b> on an infinite canvas: each holds the master prompt, variant tabs, artifacts and its own repo. Pan, zoom, move and resize them; the menu bar counts the projects that need you.</li>
<li><b>File, Edit, View, Project, Window, Help</b> menus act on the current project (blue ring).</li>
<li><b>Land or Water?</b>: Karpathy's eval recreated in three steps, the last two the orchestrator's suggestions. The maps are simulated answers scored against a real land mask (Natural Earth, 16,200 points, always-Water baseline 71.1%).</li>
<li><b>Timeline ribbon</b> under the panes: one card per step, with thumbnails, checks and cost. Click a card to play that step back.</li>
<li><b>F2P and rubric checks</b>: one fail-to-pass check that runs the artifact's numbers and must fail on a known-bad reference, and one rubric graded 1–5 by the orchestrator.</li>
<li><b>Orchestrator</b> runs Opus 5.5 at low effort and switches to a free local model when the spend cap is $0 or reached.</li>
<li>Playback scrolls every pane to its latest reply.</li></ul>
<p>Every change is a flag (Help › Flags) with the v5 behaviour as the other option.</p>`);
}

/* ---------- workspace flags ---------- */
function paintSingle() {
  if (!cur) return;
  P.forEach((p) => p.el.classList.toggle('current', p === cur));
}
function applyShellFlags() {
  ws.classList.toggle('single', F.workspace === 'single');
  ws.classList.toggle('plain', F.menuBar === 'plain');
  ws.classList.toggle('dbg', F.debugIds === 'on');
  broadcast({ mai: 'chrome', embedded: embedded() });
  if (F.workspace !== 'single') applyView();
}

function tick() { $('#wsClock').textContent = new Date().toLocaleString(undefined, { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }); }
tick(); setInterval(tick, 20000);

SEED.forEach((o) => addProject(o, true));
setCurrent(P[0]);
applyShellFlags();
if (canvas.clientWidth < 720) focusProject(P[0]); else fitAll(false);
window.maiShell = { projects: () => P.map((p) => ({ id: p.id, title: p.title, state: p.state, status: p.s.status })), view, fitAll, focus: (id) => focusProject(P.find((p) => p.id === id), false), cmd: (name, arg, id) => cmd(name, arg, id ? P.find((p) => p.id === id) : cur), setFlag: setShellFlag, flags: F };
})();
</script>
